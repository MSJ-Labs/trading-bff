spring.application.name=trading-bff
server.port=8081

# --- OAuth2 client: OIDC login against Keycloak (Authorization Code + PKCE) ---
# issuer-uri enables OIDC discovery (.well-known): endpoints and JWKS are fetched, not hand-written.
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/trading}
# Registration id "keycloak" = last segment of the redirect URI /login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.client-id=trading-bff
# No default on purpose: a secret must never have a fallback value. See .env.example.
spring.security.oauth2.client.registration.keycloak.client-secret=${BFF_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# --- Reverse proxy: /api/** -> trading-core, access token attached by TokenRelay ---
spring.cloud.gateway.server.webmvc.routes[0].id=trading-core
spring.cloud.gateway.server.webmvc.routes[0].uri=${TRADING_CORE_URI:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=TokenRelay=
# Long form (name + args) because the shortcut form cannot carry statusCodes.
# statusCodes: a downstream response with one of these statuses counts as a failure for the circuit breaker
# (and is replaced by the fallback 503). 4xx are business errors, never counted.
spring.cloud.gateway.server.webmvc.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.id=trading-core
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.fallbackPath=/fallback/trading-core
spring.cloud.gateway.server.webmvc.routes[0].filters[1].args.statusCodes=500,502,503,504

# --- Resilience: circuit breaker + per-route timeout (Resilience4j) ---
# The config name MUST equal the route's circuit breaker id (here "trading-core"), otherwise Resilience4j
# falls back to "default" (TimeLimiter default = 1s, too short).
# Time limiter = max wait for the downstream response; the call is cancelled and the fallback (503 JSON) is returned.
resilience4j.timelimiter.configs.trading-core.timeout-duration=10s
resilience4j.timelimiter.configs.trading-core.cancel-running-future=true
# Circuit breaker: opens at 50% failures over the last 20 calls (min 10), stays open 30s, then 5 trial calls.
resilience4j.circuitbreaker.configs.trading-core.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.trading-core.sliding-window-size=20
resilience4j.circuitbreaker.configs.trading-core.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.trading-core.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.trading-core.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.trading-core.permitted-number-of-calls-in-half-open-state=5
# Connect timeout is shared by all routes (the HTTP client is shared; a TCP connect is fast everywhere).
spring.http.clients.connect-timeout=2s

# --- Server-side session in Redis (the browser only holds an httpOnly cookie) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# DB 1: keeps sessions apart from trading-core's price cache (DB 0)
spring.data.redis.database=1
spring.session.data.redis.namespace=trading-bff:session
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# TODO before prod: true (HTTPS only)
server.servlet.session.cookie.secure=false

# --- Forwarded headers: DO NOT set server.forward-headers-strategy without reading this ---
# SecurityConfig exempts the BFF's own back-channel POST /logout from CSRF only when
# request.getRemoteAddr() is loopback. With forward-headers-strategy (framework/native), a client could
# forge X-Forwarded-For: 127.0.0.1 and skip CSRF on /logout. Revisit that exemption first.

# --- Frontend (trading-ui): redirect target after login and after OIDC logout ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Where the BFF calls its own /logout to close a session on back-channel logout (loopback, never public)
app.backchannel-logout-uri=${BACKCHANNEL_LOGOUT_URI:http://localhost:${server.port}/logout}

# --- Actuator on a separate management port ---
# NEVER route this port from the Ingress/Service: only 8081 is public. Kubernetes probes and
# Prometheus hit the pod IP on this port from inside the cluster.
management.server.port=9091
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.org.springframework.security=DEBUG