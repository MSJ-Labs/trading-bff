# Profile "secure-file": the same BFF jar serves the secure-file interface (SPRING_PROFILES_ACTIVE=secure-file).
# Everything not set here comes from application.properties. Only the differences are written down.
#
# One stack at a time on a machine: both BFFs name their session cookie SESSION (SecurityConfig fixes it for the
# back-channel logout) and browsers share cookies between ports of the same host.

server.port=8083
# 9091 belongs to the trading BFF
management.server.port=9093

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/secure-file}
spring.security.oauth2.client.registration.keycloak.client-id=secure-file-bff

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Stops Spring's FormContentFilter, which parses (and holds in memory) the body of any PUT, PATCH or DELETE sent as
# application/x-www-form-urlencoded, which is what Axios sets by default: for a file upload that is a 500 on the
# first "%" of the bytes, and a 2 GB body in the heap otherwise. No endpoint of the BFF takes such a form, it only
# relays bodies to the service. POST forms (/logout, back-channel logout) are read by Tomcat itself and are unaffected.
spring.mvc.formcontent.filter.enabled=false

# The gateway removes Content-Length from the requests it relays by default, so the body leaves as chunked. The service
# needs the size of an upload up front and answers 411 without it: keep the header.
spring.cloud.gateway.server.webmvc.remove-content-length-request-headers-filter.enabled=false

# Own Redis database: sessions, OIDC registry and rate limit counters never meet the trading BFF's ones.
spring.data.redis.database=2
spring.session.data.redis.namespace=secure-file-bff:session

# --- Routes: /api/v1/files/** -> secure-file-service, access token attached by TokenRelay ---
# A list replaces the one of application.properties as a whole (Spring does not merge lists), hence the trading-core
# routes are gone in this profile. First match wins, so the long transfers come first.
#
# Upload (PUT /api/v1/files) and download (GET /api/v1/files/{id}/content) carry files up to 2 GB: no CircuitBreaker
# (its 10s time limiter would cut them) and no Retry (a request body cannot be replayed, a download cannot be resumed).
spring.cloud.gateway.server.webmvc.routes[0].id=secure-file-upload
spring.cloud.gateway.server.webmvc.routes[0].uri=${SECURE_FILE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/files
spring.cloud.gateway.server.webmvc.routes[0].predicates[1]=Method=PUT
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=UserRateLimit
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.scope=upload
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.capacity=${app.rate-limit.upload-capacity:30}
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.period=${app.rate-limit.period:1m}
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=TokenRelay=

spring.cloud.gateway.server.webmvc.routes[1].id=secure-file-download
spring.cloud.gateway.server.webmvc.routes[1].uri=${SECURE_FILE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/files/*/content
spring.cloud.gateway.server.webmvc.routes[1].predicates[1]=Method=GET
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=UserRateLimit
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.scope=download
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.capacity=${app.rate-limit.download-capacity:120}
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.period=${app.rate-limit.period:1m}
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=TokenRelay=

# Everything else, as for trading-core: reads may be retried, other methods never (not idempotent).
# The status list is polled every 3s while a scan runs, hence the generous read limit.
spring.cloud.gateway.server.webmvc.routes[2].id=secure-file-read
spring.cloud.gateway.server.webmvc.routes[2].uri=${SECURE_FILE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webmvc.routes[2].predicates[1]=Method=GET,HEAD,OPTIONS
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=UserRateLimit
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.scope=read
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.capacity=${app.rate-limit.read-capacity:1000}
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.period=${app.rate-limit.period:1m}
spring.cloud.gateway.server.webmvc.routes[2].filters[1]=TokenRelay=
spring.cloud.gateway.server.webmvc.routes[2].filters[2].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[2].args.id=secure-file-service
spring.cloud.gateway.server.webmvc.routes[2].filters[2].args.fallbackPath=/fallback/secure-file-service
spring.cloud.gateway.server.webmvc.routes[2].filters[2].args.statusCodes=500,502,503,504
spring.cloud.gateway.server.webmvc.routes[2].filters[3].name=Retry
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.retries=2
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.methods=GET,HEAD,OPTIONS
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.series=SERVER_ERROR
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.exceptions=org.springframework.web.client.ResourceAccessException,java.io.UncheckedIOException
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.backoff.maxBackoff=500ms
spring.cloud.gateway.server.webmvc.routes[2].filters[3].args.backoff.factor=2

spring.cloud.gateway.server.webmvc.routes[3].id=secure-file-write
spring.cloud.gateway.server.webmvc.routes[3].uri=${SECURE_FILE_URI:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=UserRateLimit
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.scope=write
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.capacity=${app.rate-limit.write-capacity:200}
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.period=${app.rate-limit.period:1m}
spring.cloud.gateway.server.webmvc.routes[3].filters[1]=TokenRelay=
spring.cloud.gateway.server.webmvc.routes[3].filters[2].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[2].args.id=secure-file-service
spring.cloud.gateway.server.webmvc.routes[3].filters[2].args.fallbackPath=/fallback/secure-file-service
spring.cloud.gateway.server.webmvc.routes[3].filters[2].args.statusCodes=500,502,503,504

# The config name MUST equal the circuit breaker id (see application.properties).
resilience4j.timelimiter.configs.secure-file-service.timeout-duration=10s
resilience4j.timelimiter.configs.secure-file-service.cancel-running-future=true
resilience4j.circuitbreaker.configs.secure-file-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.secure-file-service.sliding-window-size=20
resilience4j.circuitbreaker.configs.secure-file-service.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.secure-file-service.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.secure-file-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.secure-file-service.permitted-number-of-calls-in-half-open-state=5
